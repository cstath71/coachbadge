name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so Closing soon / Closed statuses are right on the day.
  # 23:05 UTC = 00:05 Zurich in winter (CET), 01:05 in summer (CEST).
  # Build only: no source refetch, no newsletter, no IndexNow.
  schedule:
    - cron: '5 23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml beautifulsoup4
      - run: python scripts/build.py --today "$(TZ=Europe/Zurich date +%F)"
      - run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
